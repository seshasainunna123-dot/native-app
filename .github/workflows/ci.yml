name: React Native CI

on:
  pull_request:
    branches: [test]
  push:
    branches: [test]

jobs:
  validate:
    name: Lint, Type Check, Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Install dependencies (clean install)
      - name: Install dependencies
        run: npm ci

      # 4. Run Lint
      - name: Run ESLint
        run: npm run lint

      # 5. TypeScript check (skip if not using TS)
      - name: Type check
        run: npm run tsc --if-present

      # 6. Run tests
      - name: Run tests
        run: npm test -- --watchAll=false