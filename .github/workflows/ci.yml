name: Native Android Build CI

on:
  push:
    branches: [main, test]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Using a stable LTS version

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Setup Java (required for Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Generate debug keystore
      - name: Generate debug keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 6. Fix gradlew permission
      - name: Fix gradlew permission
        run: chmod +x android/gradlew

      # 7. Build APK using standard Native CLI style (Gradle)
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      # 8. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk